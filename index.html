<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Bet ON Brasil · Tech Edition</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{background:#0e1620;color:#dbe3f1;font-family:'Inter',system-ui,sans-serif;overflow-x:hidden;}
  body{cursor:none;}
  @keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(.85)}}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
  @keyframes marqueeL{from{transform:translateX(0%)}to{transform:translateX(-50%)}}
  @keyframes marqueeR{from{transform:translateX(-50%)}to{transform:translateX(0%)}}
  @keyframes floatY{0%,100%{transform:translateY(0)}50%{transform:translateY(8px)}}
  @keyframes glow{0%,100%{opacity:0.4}50%{opacity:1}}
  input::placeholder{color:rgba(148,163,184,0.45);}
  select option{background:#141c28;color:#dbe3f1;}
  a,button,select,input{cursor:none;}
  ::-webkit-scrollbar{width:10px;height:10px;}
  ::-webkit-scrollbar-track{background:#0e1620;}
  ::-webkit-scrollbar-thumb{background:rgba(73,253,227,0.15);border-radius:10px;}
  ::-webkit-scrollbar-thumb:hover{background:rgba(73,253,227,0.3);}
  .stat-card{height:100%;display:flex;}
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>

  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
    <rect width="100" height="100" fill="#0e1620"/>
